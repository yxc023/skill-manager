name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target.os }} / ${{ matrix.target.arch }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - {os: linux,  arch: amd64, goos: linux,  goarch: amd64, ext: ""}
          - {os: linux,  arch: arm64, goos: linux,  goarch: arm64, ext: ""}
          - {os: darwin, arch: amd64, goos: darwin, goarch: amd64, ext: ""}
          - {os: darwin, arch: arm64, goos: darwin, goarch: arm64, ext: ""}
          - {os: windows, arch: amd64, goos: windows, goarch: amd64, ext: ".exe"}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
          # Strip leading "v" from tag (v0.3.0 → 0.3.0) for ldflags injection.
          VERSION: ${{ github.ref_name }}
        run: >-
          go build
          -trimpath
          -ldflags "-s -w -X github.com/yxc023/skill-manager/internal/cmd.Version=${VERSION#v}"
          -o skill-manager-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.ext }}
          ./cmd/skill-manager

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-manager-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.ext }}
          path: skill-manager-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.ext }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum skill-manager-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: false
          # Pull in release-please's CHANGELOG section for this tag as the body.
          # Falls back to a minimal message if no body is attached.
          body: |
            ## Installation

            ```bash
            # macOS (Apple Silicon)
            curl -L https://github.com/yxc023/skill-manager/releases/download/${{ github.ref_name }}/skill-manager-darwin-arm64 -o skill-manager
            chmod +x skill-manager
            ./skill-manager --version

            # macOS (Intel) / Linux: swap the asset name to darwin-amd64 or linux-amd64.
            ```

            See [CHANGELOG.md](https://github.com/yxc023/skill-manager/blob/${{ github.ref_name }}/CHANGELOG.md) for what changed.

            ## Verification

            ```bash
            sha256sum -c checksums.txt
            ```
          files: |
            dist/skill-manager-*
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}