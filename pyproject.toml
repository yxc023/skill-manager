[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sm"
version = "0.2.2"
description = "Declarative skill manager for AI agents (think: npm for skills)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "michael"},
]
keywords = ["ai", "agent", "skill", "package-manager", "opencode", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]

# Pure stdlib — no runtime deps.
dependencies = []

[project.urls]
"Source" = "https://github.com/yxc023/skill-manager"  # placeholder
"Issues" = "https://github.com/yxc023/skill-manager/issues"  # placeholder

[project.scripts]
sm = "sm:main"

# Allow `python -m sm`
[tool.setuptools]
py-modules = ["sm"]