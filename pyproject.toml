[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-manager"
version = "0.2.3"
description = "Declarative skill manager for AI agents — think npm for skills"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "michael"},
]
keywords = ["ai", "agent", "skill", "package-manager", "opencode", "claude", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
"Homepage" = "https://github.com/yxc023/skill-manager"
"Source" = "https://github.com/yxc023/skill-manager"
"Issues" = "https://github.com/yxc023/skill-manager/issues"
"Changelog" = "https://github.com/yxc023/skill-manager/blob/main/CHANGELOG.md"

[project.scripts]
sm = "skill_manager:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_manager"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
